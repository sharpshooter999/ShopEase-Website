<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .product-container { display: flex; flex-wrap: wrap; gap: 20px; }
        .product-card {
            width: 200px; padding: 10px; border: 1px solid #ddd; 
            border-radius: 5px; text-align: center; background: #fff;
        }
        img { width: 100%; height: 150px; object-fit: cover; border-radius: 5px; }
    </style>
</head>
<body>
    <h2>Available Products</h2>
    <div class="product-container" id="productList"></div>

    <script>
        async function fetchProducts() {
            let response = await fetch('/get_products/');
            let data = await response.json();
            let productList = document.getElementById("productList");
            productList.innerHTML = "";
            
            data.products.forEach(product => {
                let productCard = document.createElement("div");
                productCard.classList.add("product-card");
                productCard.innerHTML = `
                    <img src="${product.image_url}" alt="${product.name}">
                    <h3>${product.name}</h3>
                    <p>${product.description}</p>
                    <p><b>Price: $${product.price}</b></p>
                `;
                productList.appendChild(productCard);
            });
        }

        fetchProducts();
    </script>
</body>
</html>
