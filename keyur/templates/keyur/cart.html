<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="{% static 'css/frontend.css' %}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">

  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 80px;
      background-color: #f8f9fa;
    }

    #cart-popup {
    position: absolute;
    background: green;
    color: white;
    padding: 5px 15px;
    border-radius: 5px;
    font-size: 14px;
    z-index: 1000;
    display: none; /* Initially hidden */
}
  
    /* Ensure content starts below the navbar */
    #cart {
      margin-top: 70px; /* Adjust this value to match the navbar height */
    }
  
    .navbar {
      z-index: 1030; /* Keep the navbar above other elements */
    }
  
    .cart-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      border-bottom: 1px solid #ddd;
      padding-bottom: 10px;
    }
  
    .cart-item img {
      width: 100px;
      height: 100px;
      object-fit: cover;
      border-radius: 4px;
    }
  
    .cart-item-details {
      flex: 1;
      margin-left: 20px;
    }
  
    .cart-item-details h5 {
      font-size: 18px;
      margin: 0 0 10px;
    }
  
    .cart-item-details p {
      font-size: 16px;
      color: #555;
      margin: 0;
    }
  
    .cart-item-price {
      font-size: 18px;
      font-weight: bold;
    }
  
    button {
      font-size: 16px;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
  
    .buy-btn {
      background-color: green;
      color: white;
      margin-right: 20px;
      height: 44px;
      width: 120px;
    }
  
    .remove-btn {
      background-color: red;
      color: white;
    }
  
    .buy-btn:hover,
    .remove-btn:hover {
      opacity: 0.9;
    }
  </style>
  </head>
<body>

        <ul class="navbar-nav ml-auto">
          <li class="nav-item">
            <a class="nav-link" href="{% url 'frontend' %}">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{% url 'shop' %}">Shop</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{% url 'contactus' %}">Contact Us</a>
          </li>
          <!-- <li class="nav-item">
            <div class="container my-4">
              <div class="input-group" style="max-width: 500px; margin: auto; position: relative;">
                <input 
                  id="product-search" 
                  class="form-control" 
                  type="text" 
                  placeholder="Search" 
                  style="border-radius: 20px; padding-right: 40px;">
                <i 
                  class="bx bx-search" 
                  style="position: absolute; top: 50%; right: 15px; transform: translateY(-50%); font-size: 18px; color: #aaa; cursor: pointer;">
                </i>
              </div>
            </div>            
          </li> -->
          <li class="nav-item active">
            <a href="{% url 'cart' %}" class="nav-link mx-2" style="position: relative;">
              <i id="cart-icon" class='bx bxs-shopping-bag'></i>
              <span id="cart-count" class="badge badge-danger" style="position: absolute; top: 5px; right: 5px; display: none;">0</span>
              <div id="cart-popup" class="alert alert-success">Product added to cart!</div>
            </a>                    
          </li>
          <li class="nav-item">
            <a href="{% url 'orders' %}" class="nav-link mx-2" aria-label="My orders" title="My orders"><i class="bx bx-receipt"></i></a>
          </li>
          <li class="nav-item">
            <a href="{% url 'user' %}" class="nav-link mx-2 profile-link" aria-label="User profile" title="User profile">

            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <section id="cart" class="my-5">
    <div class="container">
      <h3 class="text-center">Your Shopping Cart</h3>
      <!-- <hr class="mx-auto"> -->
      <div id="cart-items">
        <!-- Cart items will be dynamically generated here -->
      </div>
    </div>
  </section>

  <script src="{% static 'js/navigation.js' %}"></script>
  <script>
   const cartContainer = document.querySelector("#cart-items");
   const cartStorageKey = "cart_{{ request.session.user_id|default:'guest' }}";

   function getCart() {
     return JSON.parse(localStorage.getItem(cartStorageKey)) || [];
   }

   function updateCartCount() {
     const cart = getCart();
     const totalQuantity = cart.reduce((sum, item) => sum + (Number(item.quantity) || 0), 0);
     const cartCountElement = document.getElementById("cart-count");
     if (cartCountElement) {
       cartCountElement.textContent = totalQuantity;
       cartCountElement.style.display = totalQuantity ? 'block' : 'none';
     }
   }

   function renderCart() {
     const cart = getCart();
     if (!cartContainer) return;
     cartContainer.innerHTML = "";

     cart.forEach((item) => {
       if (!item.size || item.size === 'One Size') {
         item.size = 'S';
       }
     });

     if (cart.length === 0) {
       cartContainer.innerHTML = "<p>Your cart is empty.</p>";
       updateCartCount();
       return;
     }

     let totalPrice = 0;

     cart.forEach((item, index) => {
       const stockLimit = Number(item.stock) || Number(item.available_stock) || Number(item.max_stock) || 5;
       const safeQuantity = Math.min(Math.max(1, Number(item.quantity) || 1), stockLimit);
       if (safeQuantity !== Number(item.quantity)) {
         item.quantity = safeQuantity;
       }
       totalPrice += (parseFloat(item.price || 0) * safeQuantity);

      const cartItemHTML = `
         <div class="cart-item">
           <img src="${item.image}" alt="${item.name}" class="cart-item-image">
           <div class="cart-item-details">
             <h5 class="cart-item-name">${item.name}</h5>
             <p class="cart-item-price">Price: ₹${item.price || 0} · Size: ${item.size || 'Size not selected'} · Quantity: ${safeQuantity}</p>
           </div>
           <button class="buy-btn quantity-btn" data-index="${index}" data-change="-1" aria-label="Decrease quantity">−</button>
           <button class="buy-btn quantity-btn" data-index="${index}" data-change="1" aria-label="Increase quantity">+</button>
           <button class="buy-btn buy-one-btn" data-index="${index}">Buy this</button>
           <button class="remove-btn" data-index="${index}">Remove</button>
         </div>
         <hr>
       `;
       cartContainer.innerHTML += cartItemHTML;
     });

     localStorage.setItem(cartStorageKey, JSON.stringify(cart));

     cartContainer.innerHTML += `
       <div class="cart-total">
         <h4>Total Price: ₹${totalPrice.toFixed(2)}</h4>
         <button class="buy-btn buy-all-btn">Buy all</button>
       </div>
     `;

     document.querySelectorAll(".buy-one-btn").forEach((button) => {
       button.addEventListener("click", function () {
         const currentCart = getCart();
         const selectedItem = currentCart[Number(this.dataset.index)];
         if (!selectedItem.size || selectedItem.size === 'One Size') {
           alert('Please select a size before buying this product.');
           return;
         }
         localStorage.setItem(`${cartStorageKey}_checkout`, JSON.stringify([selectedItem]));
         window.location.href = "{% url 'address' %}";
       });
     });

     const buyAllButton = document.querySelector(".buy-all-btn");
     if (buyAllButton) {
       buyAllButton.addEventListener("click", function () {
         const currentCart = getCart();
         if (currentCart.some((item) => !item.size || item.size === 'One Size')) {
           alert('Please select a size for every product before buying all.');
           return;
         }
         localStorage.setItem(`${cartStorageKey}_checkout`, JSON.stringify(currentCart));
         window.location.href = "{% url 'address' %}";
       });
     }


     document.querySelectorAll(".remove-btn").forEach((button) => {
       button.addEventListener("click", function () {
         const index = Number(this.getAttribute("data-index"));
         const currentCart = getCart();
         currentCart.splice(index, 1);
         localStorage.setItem(cartStorageKey, JSON.stringify(currentCart));
         renderCart();
       });
     });

     document.querySelectorAll(".quantity-btn").forEach((button) => {
       button.addEventListener("click", function () {
         const index = Number(this.dataset.index);
         const currentCart = getCart();
         const stockLimit = Number(currentCart[index].stock) || Number(currentCart[index].available_stock) || Number(currentCart[index].max_stock) || 5;
         const updatedQty = Math.max(1, (Number(currentCart[index].quantity) || 1) + Number(this.dataset.change));
         currentCart[index].quantity = Math.min(updatedQty, stockLimit);
         localStorage.setItem(cartStorageKey, JSON.stringify(currentCart));
         renderCart();
       });
     });

     updateCartCount();
   }

   function addToCart(productName, productPrice, productImage, stockLimit = 5) {
     const cart = getCart();
     const key = `${productName}|${productPrice}|${productImage}`;
     const existing = cart.find((item) => `${item.name}|${item.price}|${item.image}` === key);

     if (existing) {
       existing.quantity = Math.min((Number(existing.quantity) || 1) + 1, Number(stockLimit) || 5);
       existing.stock = Number(stockLimit) || 5;
     } else {
       cart.push({ name: productName, price: productPrice, image: productImage, quantity: 1, stock: Number(stockLimit) || 5 });
     }

     localStorage.setItem(cartStorageKey, JSON.stringify(cart));

     const popup = document.getElementById("cart-popup");
     if (popup) {
       popup.style.display = "block";
       setTimeout(() => {
         popup.style.display = "none";
       }, 2000);
     }

     updateCartCount();
   }

   renderCart();
   document.addEventListener("DOMContentLoaded", () => {
     updateCartCount();
     renderCart();
   });

  </script>

<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js" integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js" integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF" crossorigin="anonymous"></script>

</body>
</html>
