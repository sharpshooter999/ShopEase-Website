<body>
    <header class="welcome">
        <i class="bx bxs-shield icon-shield"></i>
        <h1>Welcome Back!</h1>
        <p>Please choose how you want to continue</p>
        <span></span>
    </header>

    <main class="container">
        <section class="box user" onclick="selectRole('user')">
            <i class="bx bxs-user-circle role-icon"></i>
            <h2>User</h2>
            <p>Access your account and<br>manage your profile</p>
            <button type="button">
                <i class="bx bx-chevron-right"></i>
                Login as User
            </button>
        </section>

        <section class="box admin" onclick="selectRole('admin')">
            <i class="bx bxs-user-pin role-icon"></i>
            <h2>Admin</h2>
            <p>Access admin panel and<br>manage the system</p>
            <button type="button">
                <i class="bx bx-chevron-right"></i>
                Login as Admin
            </button>
        </section>
    </main>

    <div id="loading" class="loading">Redirecting...</div>

    <script>
        function selectRole(role) {
            document.getElementById("loading").classList.add("show");

            setTimeout(() => {
                window.location.href = role === "admin"
                    ? "/admin/"
                    : "{% url 'login' %}";
            }, 400);
        }
    </script>
</body>
</html>
